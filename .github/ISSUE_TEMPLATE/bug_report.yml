name: Bug report
description: A rule misfires, a scan crashes, or a command misbehaves
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest project or file that shows it. A false positive/negative is most useful as a few lines of code.
      render: shell
  - type: input
    id: version
    attributes:
      label: SECOR and Node version
      placeholder: "secor 1.0.0, node 22.x"
    validations:
      required: true
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Confirm
      options:
        - label: My report contains no real secrets or personal data.
          required: true
